<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elvestrøm — Drijfhout Kunstobjecten uit Noorwegen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Archivo:wght@600;700;800&family=Manrope:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" id="theme-css" href="css/theme-nachtelijke-fjord.css">
</head>
<body>

<div id="theme-switcher" class="theme-switcher" hidden>
  <button data-theme="steenmuseum">Steenmuseum</button>
  <button data-theme="nachtelijke-fjord">Nachtelijke Fjord</button>
  <button data-theme="archiefkaart">Archiefkaart</button>
  <button data-theme="rauw-beton">Rauw Beton</button>
  <button data-theme="vloedlijn">Vloedlijn</button>
  <button data-theme="bronsgieterij">Bronsgieterij</button>
  <button data-theme="noorderlicht">Noorderlicht</button>
  <button data-theme="scheepsregister">Scheepsregister</button>
  <button data-theme="wit-atelier">Wit Atelier</button>
  <button data-theme="runesteen">Runesteen</button>
</div>

<header class="site-header">
  <div class="site-logo" onclick="window.scrollTo({top:0,behavior:'smooth'})">Elvestrøm</div>
  <nav><ul>
    <li><a onclick="document.getElementById('gallery-section').scrollIntoView({behavior:'smooth'})">Collectie</a></li>
    <li><a href="https://elvestrom-driftwood.101-a9b.workers.dev/admin" target="_blank">Beheer</a></li>
  </ul></nav>
  <div class="account-area" id="account-area"></div>
</header>

<section class="hero" id="hero">
  <div class="hero-media"><img id="hero-img" src="" alt=""></div>
  <div class="hero-panel">
    <div class="object-tag" id="hero-tag"><span class="dot"></span><span id="hero-tag-text"></span></div>
    <h1 id="hero-title">Elvestrøm</h1>
    <p id="hero-desc">Exclusieve drijfhout-kunstobjecten, geborgen uit de rivieren van Noorwegen.</p>
    <div class="price-row" id="hero-price-row"></div>
    <button class="btn" id="hero-cta" hidden>Bestel dit object</button>
  </div>
</section>

<section class="gallery-intro" id="gallery-section">
  <h2>De collectie</h2>
  <span class="count" id="gallery-count"></span>
</section>

<div class="gallery" id="gallery"></div>

<footer>ELVESTRØM — drijfhout, geborgen uit de rivieren van Noorwegen</footer>

<!-- ---- Login/Register modal ---- -->
<div class="modal-overlay" id="auth-modal">
  <div class="modal">
    <button class="close" onclick="closeModal('auth-modal')">&times;</button>
    <h3 id="auth-title">Inloggen</h3>
    <div class="error-msg" id="auth-error"></div>
    <input id="auth-email" type="email" placeholder="E-mail" autocomplete="username">
    <input id="auth-password" type="password" placeholder="Wachtwoord" autocomplete="current-password">
    <button class="btn" style="width:100%" onclick="submitAuth()">Inloggen</button>
    <div class="switch" onclick="toggleAuthMode()">Nog geen account? Registreer hier.</div>
  </div>
</div>

<!-- ---- Checkout modal ---- -->
<div class="modal-overlay" id="checkout-modal">
  <div class="modal">
    <button class="close" onclick="closeModal('checkout-modal')">&times;</button>
    <h3>Bestelling — <span id="co-title"></span></h3>
    <div class="error-msg" id="co-error"></div>
    <select id="co-country"></select>
    <input id="co-discount" type="text" placeholder="Kortingscode (optioneel)">
    <button class="btn" style="width:100%" onclick="submitCheckout()">Bestelling plaatsen</button>
  </div>
</div>

<!-- ---- Order confirmation modal ---- -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <button class="close" onclick="closeModal('confirm-modal')">&times;</button>
    <h3>Bestelling ontvangen</h3>
    <div id="confirm-body"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
